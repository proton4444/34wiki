services:
  postgres:
    image: postgres:15-alpine
    container_name: outline-postgres
    environment:
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: outline
    volumes:
      - ./data-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - outline-net

  redis:
    image: redis:7-alpine
    container_name: outline-redis
    command: ["redis-server", "--appendonly", "no"]
    volumes:
      - ./data-redis:/data
    restart: unless-stopped
    networks:
      - outline-net

  keycloak:
    image: keycloak/keycloak:latest
    container_name: outline-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Hostname configuration for Docker networking
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_ADDRESS_FORWARDING: "true"
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - outline-net
    command:
      - "start-dev"

  outline:
    image: outlinewiki/outline:latest
    container_name: outline-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    expose:
      - "3000"
    environment:
      # ----- Core Settings -----
      NODE_ENV: production
      URL: ${OUTLINE_URL}
      PORT: 3000
      SECRET_KEY: ${SECRET_KEY}
      UTILS_SECRET: ${UTILS_SECRET}
      DEFAULT_LANGUAGE: en_US

      # ----- Database -----
      DATABASE_URL: postgres://outline:${POSTGRES_PASSWORD}@postgres:5432/outline
      PGSSLMODE: disable

      # ----- Redis -----
      REDIS_URL: redis://redis:6379

      # ----- File Storage (Local Disk - No S3) -----
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE_UPLOAD_MAX_SIZE: "262144000"

      # ----- HTTPS Settings -----
      FORCE_HTTPS: "false"

      # ----- Generic OIDC Authentication -----
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: "not-used-for-public-clients"
      OIDC_AUTH_URI: ${OIDC_AUTH_URI}
      OIDC_TOKEN_URI: ${OIDC_TOKEN_URI}
      OIDC_USERINFO_URI: ${OIDC_USERINFO_URI}
      OIDC_USERNAME_CLAIM: preferred_username
      OIDC_DISPLAY_NAME: "OpenID Connect"
      OIDC_SCOPES: "openid profile email"

      # ----- Optional: Google OAuth (for later, when you have HTTPS) -----
      # GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # ----- Optional: SMTP for email notifications -----
      # SMTP_HOST: ${SMTP_HOST}
      # SMTP_PORT: ${SMTP_PORT}
      # SMTP_USERNAME: ${SMTP_USERNAME}
      # SMTP_PASSWORD: ${SMTP_PASSWORD}
      # SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      # SMTP_SECURE: "true"

      # ----- Branding & Customization -----
      TEAM_LOGO: "/assets/favicon.svg"
      WORKSPACE_NAME: "34Wiki"

      # ----- Logging -----
      LOG_LEVEL: debug

    volumes:
      - ./data-outline:/var/lib/outline/data
    restart: unless-stopped
    networks:
      - outline-net

  nginx:
    image: nginx:alpine
    container_name: outline-nginx
    depends_on:
      - outline
    ports:
      - "6875:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./custom-branding.css:/var/www/assets/custom-branding.css:ro
      - ./branding.js:/var/www/assets/branding.js:ro
      - ./logo.png:/var/www/assets/logo.png:ro
      - ./favicon.svg:/var/www/assets/favicon.svg:ro
    restart: unless-stopped
    networks:
      - outline-net

networks:
  outline-net:
    name: outline-net
    driver: bridge
