user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 256M;

    # Enable sub_filter for CSS injection
    sub_filter_once off;
    sub_filter_types text/html;

    upstream outline_backend {
        server outline-app:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Intercept and replace Outline's default favicons with custom ones (must be before /)
        location ~ ^/images/favicon.*\.(png|ico)$ {
            return 307 /favicon.svg;
        }

        location ~ ^/images/apple-touch-icon\.png$ {
            return 307 /favicon.svg;
        }

        # Serve static assets
        location /assets/ {
            alias /var/www/assets/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Proxy to Outline backend
        location / {
            proxy_pass http://outline_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Override all security headers for development
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "" always;
        }

        # Serve custom branding CSS
        location /assets/custom-branding.css {
            alias /var/www/assets/custom-branding.css;
            add_header Content-Type text/css;
            add_header Cache-Control "public, max-age=3600";
            expires 1h;
        }

        # Serve branding JavaScript
        location /assets/branding.js {
            alias /var/www/assets/branding.js;
            add_header Content-Type application/javascript;
            add_header Cache-Control "public, max-age=3600";
            expires 1h;
        }

        # Serve custom logo
        location /assets/logo.png {
            alias /var/www/assets/logo.png;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Serve custom favicon
        location /favicon.svg {
            alias /var/www/assets/favicon.svg;
            add_header Content-Type image/svg+xml;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /favicon.ico {
            alias /var/www/assets/favicon.svg;
            add_header Content-Type image/svg+xml;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
